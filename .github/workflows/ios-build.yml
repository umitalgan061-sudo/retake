name: iOS build

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/Retake.xcodeproj \
            -scheme Retake \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
