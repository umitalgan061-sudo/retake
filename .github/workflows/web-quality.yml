name: Web quality

on:
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "src/**"
      - "worker/**"
      - "wrangler.toml"
      - "docs/NVIDIA_SETUP.md"
      - "tests/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "tools/validate_assets.py"
      - "tools/facefusion_local_server.py"
      - "tools/retake_detail.py"
      - "tools/retake_appearance.py"
      - "tools/ultra_*.py"
      - "tools/identity_selection.py"
      - "tools/retake_rim_cleanup.py"
      - "tools/lower_face_transfer.py"
      - "tools/retake_compositing.py"
      - "tools/retake_cache.py"
      - "tools/retake_background.py"
      - "tools/local_flux2_editor.py"
      - "tools/*.ps1"
      - "docs/LOCAL_FACEFUSION_SETUP.md"
      - "docs/LOCAL_COMFYUI_SETUP.md"
      - "README.md"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "src/**"
      - "worker/**"
      - "wrangler.toml"
      - "docs/NVIDIA_SETUP.md"
      - "tests/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "tools/validate_assets.py"
      - "tools/facefusion_local_server.py"
      - "tools/retake_detail.py"
      - "tools/retake_appearance.py"
      - "tools/ultra_*.py"
      - "tools/identity_selection.py"
      - "tools/retake_rim_cleanup.py"
      - "tools/lower_face_transfer.py"
      - "tools/retake_compositing.py"
      - "tools/retake_cache.py"
      - "tools/retake_background.py"
      - "tools/local_flux2_editor.py"
      - "tools/*.ps1"
      - "docs/LOCAL_FACEFUSION_SETUP.md"
      - "docs/LOCAL_COMFYUI_SETUP.md"
      - "README.md"

concurrency:
  group: retake-web-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Validate repository assets
        run: python3 tools/validate_assets.py
      - name: Check local FaceFusion server and ArcFace worker Python syntax
        run: python3 -m py_compile tools/facefusion_local_server.py tools/retake_detail.py tools/retake_appearance.py tools/facefusion_identity_worker.py tools/identity_consistency.py tools/identity_selection.py tools/retake_rim_cleanup.py tools/lower_face_transfer.py tools/ultra_mode.py tools/ultra_quality.py tools/photo_realism_gate.py tools/facefusion_quality.py tools/retake_compositing.py tools/retake_cache.py tools/retake_background.py tools/local_flux2_editor.py
      - name: Install OpenCV and NumPy for the compositing tests
        run: python3 -m pip install --quiet numpy opencv-python-headless Pillow
      - name: Run local FaceFusion configuration tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check src/core.js
          node --check src/nvidia-pipeline.js
          node --check src/head-geometry.js
          node --check src/forma-sculpture.js
          node --check src/engine.js
          node --check src/reference-cache.js
          node --check src/quality.js
          node --check src/real-face.js
          node --check worker/index.js
          node --check tools/deploy-worker.mjs
          node --check functions/index.js
          node --check functions/lib/nvidia.js
          node --check sw.js

  windows-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse Windows PowerShell scripts (5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @("tools/install_retake_autostart.ps1", "tools/update_retake_ultra.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { $errors | Format-List; throw "PowerShell parse failed: $file" }
          }
      - name: Test cleanup and launcher logic (no GPU)
        shell: powershell
        run: |
          python -m pip install numpy opencv-python-headless Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_engine_lifecycle.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
