name: Web quality

on:
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "src/**"
      - "worker/**"
      - "wrangler.toml"
      - "docs/NVIDIA_SETUP.md"
      - "tests/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "tools/validate_assets.py"
      - "tools/facefusion_local_server.py"
      - "tools/*.ps1"
      - "docs/LOCAL_FACEFUSION_SETUP.md"
      - "docs/LOCAL_COMFYUI_SETUP.md"
      - "README.md"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "src/**"
      - "worker/**"
      - "wrangler.toml"
      - "docs/NVIDIA_SETUP.md"
      - "tests/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "tools/validate_assets.py"
      - "tools/facefusion_local_server.py"
      - "tools/*.ps1"
      - "docs/LOCAL_FACEFUSION_SETUP.md"
      - "docs/LOCAL_COMFYUI_SETUP.md"
      - "README.md"

concurrency:
  group: retake-web-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Validate repository assets
        run: python3 tools/validate_assets.py
      - name: Check local FaceFusion server Python syntax
        run: python3 -m py_compile tools/facefusion_local_server.py
      - name: Run local FaceFusion configuration tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check src/core.js
          node --check src/nvidia-pipeline.js
          node --check worker/index.js
          node --check tools/deploy-worker.mjs
          node --check functions/index.js
          node --check functions/lib/nvidia.js
          node --check sw.js