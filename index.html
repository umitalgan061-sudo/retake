<html lang="tr">
<head>

  <meta name="theme-color" content="#0f0f1a" />
  <meta name="description" content="Retake geometrik yüz önizleme prototipi. Gerçek AI Face Swap veya çevrimdışı iOS motoru değildir." />

  <style>
    :root {
      --bg: #0f0f1a;
      --fg: #eaeaea;
      --muted: #888;
      --accent: #00d4aa;
      --accent-dim: #00b894;
      --danger: #ff4757;
      --card: #1a1a2e;
      --border: #2a2a4a;
      --focus: #00d4aa;
      --overlay: rgba(15, 15, 26, 0.9);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0f0f5;
        --fg: #1a1a2e;
        --muted: #666;
        --accent: #00a88a;
        --accent-dim: #00967a;
        --danger: #e03e4e;
        --card: #ffffff;
        --border: #ddd;
        --focus: #00a88a;
        --overlay: rgba(240, 240, 245, 0.95);
      }
    }
    [data-theme="light"] {
      --bg: #f0f0f5;
      --fg: #1a1a2e;
      --muted: #666;
      --accent: #00a88a;
      --accent-dim: #00967a;
      --danger: #e03e4e;
      --card: #ffffff;
      --border: #ddd;
      --focus: #00a88a;
      --overlay: rgba(240, 240, 245, 0.95);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    .prototype-banner {
      padding: 0.55rem 1rem;
      background: #332b1c;
      color: #f4d58a;
      border-bottom: 1px solid #5a4824;
      font-size: 0.78rem;
      line-height: 1.4;
      text-align: center;
      flex-shrink: 0;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 100vw;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }
    .icon-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent); }
    .icon-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    #videoContainer {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #videoContainer video,
    #videoContainer canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #videoContainer video { z-index: 1; transform: scaleX(-1); }
    #videoContainer canvas { z-index: 2; pointer-events: none; }
    .status-overlay {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--overlay);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
      z-index: 5;
      transition: opacity 0.3s;
    }
    .status-overlay.hidden { opacity: 0; pointer-events: none; }
    .status-overlay.active { color: var(--accent); }
    .face-selector {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent, var(--overlay) 30%, var(--card));
      backdrop-filter: blur(12px);
      padding: 1rem 1rem 2rem;
      z-index: 10;
    }
    .selector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding: 0 0.5rem;
    }
    .selector-title { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
    .face-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 0.5rem;
      max-height: 140px;
      overflow-y: auto;
      padding: 0 0.5rem 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .face-grid::-webkit-scrollbar { height: 6px; }
    .face-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .face-option {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      background: var(--bg);
    }
    .face-option:hover { transform: scale(1.05); border-color: var(--accent); }
    .face-option.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .face-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .face-option .check {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #0d1b17;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s, transform 0.2s;
    }
    .face-option.selected .check { opacity: 1; transform: scale(1); }
    .controls {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: var(--card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .btn-primary { background: var(--accent); color: #0d1b17; box-shadow: 0 2px 8px rgba(0, 212, 170, 0.3); }
    .btn-primary:hover { background: var(--accent-dim); }
    .btn-secondary { background: var(--bg); color: var(--fg); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.9; }
    .toast {
      position: fixed;
      bottom: 8rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      z-index: 100;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    @media (max-width: 480px) {
      .face-grid { grid-template-columns: repeat(5, 1fr); }
      .face-option { min-width: 64px; }
      h1 { font-size: 1.1rem; }
      .btn { padding: 0.5rem 1rem; font-size: 0.85rem; }
    }
    @media (max-width: 360px) {
      .face-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Retake</h1>
      <div class="header-actions">
        <button class="icon-btn" id="cameraFlipBtn" aria-label="Kamerayı çevir" title="Kamerayı çevir">🔄</button>
        <button class="icon-btn" id="themeBtn" aria-label="Tema değiştir" title="Tema değiştir">🌙</button>
      </div>
    </header>
    <main>
      <div id="videoContainer">
        <video id="video" autoplay playsinline muted aria-hidden="true"></video>
        <canvas id="outputCanvas" aria-hidden="true"></canvas>
        <div id="statusOverlay" class="status-overlay">Model yükleniyor...</div>
      </div>
      <div class="face-selector" id="faceSelector">
        <div class="selector-header">
          <span class="selector-title">Referans Yüzler (20)</span>
          <span id="selectedCount" style="font-size:0.8rem;color:var(--accent)">Seçili: -</span>
        </div>
        <div class="face-grid" id="faceGrid" role="listbox" aria-label="Referans yüz seçenekleri"></div>
      </div>
      <div class="controls">
        <button class="btn btn-secondary" id="captureBtn">📸 Fotoğraf Çek</button>
        <button class="btn btn-primary" id="swapBtn" disabled>✨ Yüz Değiştir</button>
        <button class="btn btn-secondary" id="downloadBtn" disabled>⬇ İndir</button>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module">
    import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

    // --- STATE ---
    const video = document.getElementById('video');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusOverlay = document.getElementById('statusOverlay');
    const faceGrid = document.getElementById('faceGrid');
    const selectedCount = document.getElementById('selectedCount');
    const swapBtn = document.getElementById('swapBtn');
    const captureBtn = document.getElementById('captureBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const cameraFlipBtn = document.getElementById('cameraFlipBtn');
    const themeBtn = document.getElementById('themeBtn');
    const toast = document.getElementById('toast');

    let faceLandmarker = null;
    let stream = null;
    let currentFacing = 'user';
    let referenceFaces = [];
    let selectedFaceIndex = -1;
    let lastSwappedImage = null;
    let animationId = null;
    let isProcessing = false;

    // --- REFERANS YÜZ LİSTESİ (20 adet) ---
    const REFERENCE_FACE_FILES = [
      '33F4BCA9-78DC-4382-B4E7-F7FD897722B3.jpeg',
      '37D27514-F417-42AC-B9ED-4C5C3D98EA3C.jpeg',
      '6074c30a-147b-481e-9fe5-36d02c892d48.jpeg',
      '769BDFF4-5555-471B-AEC8-768C274912D0.jpeg',
      '90F8BF41-96FF-44C3-AD23-0E14C2D6A1E4.jpeg',
      '97574DEE-ED27-45BC-834A-4CCEC2E7A8F9.png',
      'BAAC2698-A3BE-4C24-87FF-1345627644A7.jpeg',
      'IMG_0706.jpeg',
      'IMG_0892.jpeg',
      'IMG_1699.jpeg',
      'IMG_2181.jpeg',
      'IMG_2266.jpeg',
      'IMG_3031.jpeg',
      'IMG_3331.jpeg',
      'IMG_3511.jpeg',
      'IMG_3882.jpeg',
      'IMG_4435.jpeg',
      'IMG_6609.jpeg',
      'IMG_9038.jpeg',
      'IMG_9438.jpeg'
    ];

    const REFERENCE_BASE_URL = 'reference-faces/';

    // --- UTIL ---
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
    function setStatus(msg, active = false) {
      statusOverlay.textContent = msg;
      statusOverlay.classList.toggle('hidden', !msg);
      statusOverlay.classList.toggle('active', active);
    }
    function loadTheme() {
      const saved = localStorage.getItem('faceswap_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      themeBtn.textContent = theme === 'dark' ? '🌙' : '☀️';
    }
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.dataset.theme === 'dark';
      html.dataset.theme = isDark ? 'light' : 'dark';
      localStorage.setItem('faceswap_theme', html.dataset.theme);
      themeBtn.textContent = isDark ? '☀️' : '🌙';
    }

    // --- KAMERA ---
    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        resizeCanvas();
        setStatus('Kamera hazır. Yüz seçin.', true);
      } catch (e) {
        setStatus('Kamera erişimi reddedildi veya bulunamadı.');
        showToast('Kamera hatası: ' + e.message);
      }
    }
    function resizeCanvas() {
      const rect = video.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
    }
    cameraFlipBtn.addEventListener('click', () => {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      startCamera();
    });
    themeBtn.addEventListener('click', toggleTheme);
    window.addEventListener('resize', resizeCanvas);

    // --- REFERANS YÜZLERİ YÜKLE ---
    async function loadReferenceFaces() {
      faceGrid.innerHTML = '';
      referenceFaces = [];

      for (let i = 0; i < REFERENCE_FACE_FILES.length; i++) {
        const file = REFERENCE_FACE_FILES[i];
        const url = REFERENCE_BASE_URL + file;

        const option = document.createElement('div');
        option.className = 'face-option';
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', 'false');
        option.dataset.index = i;

        const img = document.createElement('img');
        img.src = url;
        img.alt = `Referans yüz ${i + 1}`;
        img.loading = 'lazy';

        const check = document.createElement('span');
        check.className = 'check';
        check.textContent = '✓';

        option.appendChild(img);
        option.appendChild(check);

        option.addEventListener('click', () => selectFace(i));
        option.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectFace(i); }
        });
        option.tabIndex = 0;

        faceGrid.appendChild(option);

        // Resim yüklendiğinde landmark çıkar ve sakla
        img.addEventListener('load', async () => {
          if (faceLandmarker) {
            try {
              const landmarks = await getFaceLandmarksFromImage(img);
              if (landmarks) {
                referenceFaces[i] = { image: img, landmarks, url };
              }
            } catch (e) {
              console.warn('Referans yüz işlenemedi:', file, e);
            }
          }
        });
      }
      selectedCount.textContent = 'Seçili: -';
    }

    // --- MEDIAPIPE FACE LANDMARKER ---
    async function initFaceLandmarker() {
      setStatus('MediaPipe model yükleniyor...');
      try {
        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
        );
        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numFaces: 1,
          minFaceDetectionConfidence: 0.5,
          minFacePresenceConfidence: 0.5,
          minTrackingConfidence: 0.5,
          outputFaceBlendshapes: false,
          outputFacialTransformationMatrixes: true
        });
        setStatus('Model hazır. Kamerayı başlatıyorum...', true);
        await startCamera();
        await loadReferenceFaces();
        requestAnimationFrame(processFrame);
      } catch (e) {
        setStatus('Model yüklenemedi: ' + e.message);
        showToast('Model hatası: ' + e.message);
        console.error(e);
      }
    }

    // Bir <img> elemanından landmark çıkar
    async function getFaceLandmarksFromImage(imgEl) {
      if (!faceLandmarker) return null;
      const mpImage = await createMPImage(imgEl);
      const result = faceLandmarker.detect(mpImage);
      if (result.faceLandmarks.length === 0) return null;
      return result.faceLandmarks[0]; // [x, y, z] normalized 0-1
    }

    // Video karesinden landmark çıkar
    async function getFaceLandmarksFromVideo() {
      if (!faceLandmarker || video.readyState < 2) return null;
      const mpImage = await createMPImage(video);
      const result = faceLandmarker.detectForVideo(mpImage, performance.now());
      if (result.faceLandmarks.length === 0) return null;
      return result.faceLandmarks[0];
    }

    async function createMPImage(source) {
      const { Image } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      return Image.fromImageData(source);
    }

    // --- FACE SELECTION ---
    function selectFace(index) {
      if (!referenceFaces[index] || !referenceFaces[index].landmarks) {
        showToast('Bu yüz henüz işlenmedi, bekleyin...');
        return;
      }
      document.querySelectorAll('.face-option').forEach((el, i) => {
        el.classList.toggle('selected', i === index);
        el.setAttribute('aria-selected', i === index);
      });
      selectedFaceIndex = index;
      selectedCount.textContent = `Seçili: #${index + 1}`;
      swapBtn.disabled = false;
      showToast(`Referans yüz #${index + 1} seçildi`);
    }

    // --- TRIANGULATION (Delaunay - basit fan triangulation) ---
    const FACE_OVAL_INDICES = [
      10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288,
      397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136,
      172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109
    ];

    function triangulate(points) {
      if (points.length < 3) return [];
      const cx = points.reduce((s, p) => s + p[0], 0) / points.length;
      const cy = points.reduce((s, p) => s + p[1], 0) / points.length;
      const sorted = points.map((p, i) => ({ p, i, angle: Math.atan2(p[1] - cy, p[0] - cx) }))
        .sort((a, b) => a.angle - b.angle);
      const triangles = [];
      for (let i = 1; i < sorted.length - 1; i++) {
        triangles.push([sorted[0].i, sorted[i].i, sorted[i + 1].i]);
      }
      return triangles;
    }

    // --- AFFINE WARP PER TRIANGLE (clip + transform) ---
    function drawWarpedFace(srcImg, srcLandmarks, dstLandmarks, dstWidth, dstHeight) {
      ctx.save();
      ctx.clearRect(0, 0, dstWidth, dstHeight);

      const srcOvalPoints = FACE_OVAL_INDICES.map(i => [srcLandmarks[i][0], srcLandmarks[i][1]]);
      const triangles = triangulate(srcOvalPoints);

      for (const tri of triangles) {
        const srcTri = tri.map(idx => [srcLandmarks[FACE_OVAL_INDICES[idx]][0], srcLandmarks[FACE_OVAL_INDICES[idx]][1]]);
        const dstTri = tri.map(idx => [dstLandmarks[FACE_OVAL_INDICES[idx]][0] * dstWidth, dstLandmarks[FACE_OVAL_INDICES[idx]][1] * dstHeight]);

        // Clip path
        ctx.beginPath();
        ctx.moveTo(dstTri[0][0], dstTri[0][1]);
        ctx.lineTo(dstTri[1][0], dstTri[1][1]);
        ctx.lineTo(dstTri[2][0], dstTri[2][1]);
        ctx.closePath();
        ctx.clip();

        // Affine transform: srcTri -> dstTri
        const [s1, s2, s3] = srcTri;
        const [d1, d2, d3] = dstTri;

        const denom = (s1[0]*(s2[1]-s3[1]) + s2[0]*(s3[1]-s1[1]) + s3[0]*(s1[1]-s2[1]));
        if (Math.abs(denom) < 1e-6) { ctx.restore(); ctx.save(); continue; }

        const a = (d1[0]*(s2[1]-s3[1]) + d2[0]*(s3[1]-s1[1]) + d3[0]*(s1[1]-s2[1])) / denom;
        const b = (d1[0]*(s3[0]-s2[0]) + d2[0]*(s1[0]-s3[0]) + d3[0]*(s2[0]-s1[0])) / denom;
        const c = (d1[0]*(s2[0]*s3[1]-s3[0]*s2[1]) + d2[0]*(s3[0]*s1[1]-s1[0]*s3[1]) + d3[0]*(s1[0]*s2[1]-s2[0]*s1[1])) / denom;
        const d = (d1[1]*(s2[1]-s3[1]) + d2[1]*(s3[1]-s1[1]) + d3[1]*(s1[1]-s2[1])) / denom;
        const e = (d1[1]*(s3[0]-s2[0]) + d2[1]*(s1[0]-s3[0]) + d3[1]*(s2[0]-s1[0])) / denom;
        const f = (d1[1]*(s2[0]*s3[1]-s3[0]*s2[1]) + d2[1]*(s3[0]*s1[1]-s1[0]*s3[1]) + d3[1]*(s1[0]*s2[1]-s2[0]*s1[1])) / denom;

        ctx.transform(a, d, b, e, c, f);
        ctx.drawImage(srcImg, 0, 0);
        ctx.restore();
        ctx.save();
      }
      ctx.restore();
    }

    // --- MAIN PROCESS LOOP ---
    async function processFrame() {
      if (!faceLandmarker || video.readyState < 2) {
        animationId = requestAnimationFrame(processFrame);
        return;
      }

      resizeCanvas();

      // Video karesini canvas'a çiz (aynı boyut)
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Yüz tespiti
      const landmarks = await getFaceLandmarksFromVideo();

      if (landmarks && selectedFaceIndex >= 0 && referenceFaces[selectedFaceIndex]) {
        const ref = referenceFaces[selectedFaceIndex];
        if (ref.landmarks) {
          // Face swap yap
          drawWarpedFace(ref.image, ref.landmarks, landmarks, canvas.width, canvas.height);
          swapBtn.textContent = '✨ Yüz Değiştir (Aktif)';
          swapBtn.classList.add('btn-primary');
        }
      } else {
        // Sadece videoyu göster (zaten çizildi)
        swapBtn.textContent = '✨ Yüz Değiştir';
        swapBtn.classList.remove('btn-primary');
      }

      animationId = requestAnimationFrame(processFrame);
    }

    // --- CAPTURE & DOWNLOAD ---
    captureBtn.addEventListener('click', () => {
      if (!canvas.width || !canvas.height) {
        showToast('Henüz kaydedilecek bir görüntü yok.');
        return;
      }
      // Her çekimde güncel canvas görüntüsünü al; önceki fotoğrafı tekrar kullanma.
      lastSwappedImage = canvas.toDataURL('image/png');
      showToast('Güncel görüntü kaydedildi. İndirebilirsiniz.');
      downloadBtn.disabled = false;
    });

    downloadBtn.addEventListener('click', () => {
      if (!lastSwappedImage) {
        lastSwappedImage = canvas.toDataURL('image/png');
      }
      const a = document.createElement('a');
      a.href = lastSwappedImage;
      a.download = `face-swap-${Date.now()}.png`;
      a.click();
      showToast('İndirildi!');
    });

    swapBtn.addEventListener('click', () => {
      if (selectedFaceIndex >= 0) {
        showToast('Yüz değiştirme aktif - Kamerada görüyorsunuz');
      } else {
        showToast('Önce bir referans yüz seçin');
      }
    });

    // --- INIT ---
    loadTheme();
    initFaceLandmarker();
  </script>
</body>
</html>
