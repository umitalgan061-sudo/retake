<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Retake - Anında yeniden başlatma döngüsü için minimal uygulama">
  <title>Retake</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #0d0d12;
      --fg: #e8e8ec;
      --muted: #6b6b7a;
      --accent: #00d4aa;
      --accent-dim: #00d4aa33;
      --card: #161622;
      --border: #2a2a3e;
      --danger: #ff4757;
      --focus: #00d4aa;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f4f8;
        --fg: #1a1a2e;
        --muted: #6b6b7a;
        --accent: #00a88a;
        --accent-dim: #00a88a33;
        --card: #ffffff;
        --border: #d0d0e0;
        --danger: #e03040;
        --focus: #00a88a;
      }
    }
    [data-theme="light"] {
      --bg: #f4f4f8;
      --fg: #1a1a2e;
      --muted: #6b6b7a;
      --accent: #00a88a;
      --accent-dim: #00a88a33;
      --card: #ffffff;
      --border: #d0d0e0;
      --danger: #e03040;
      --focus: #00a88a;
    }
    [data-theme="dark"] {
      --bg: #0d0d12;
      --fg: #e8e8ec;
      --muted: #6b6b7a;
      --accent: #00d4aa;
      --accent-dim: #00d4aa33;
      --card: #161622;
      --border: #2a2a3e;
      --danger: #ff4757;
      --focus: #00d4aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: clamp(16px, 4vh, 32px) clamp(12px, 3vw, 24px);
      transition: background 0.3s, color 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: clamp(16px, 3vh, 24px); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; letter-spacing: -0.02em; color: var(--fg); }
    .theme-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.2s, background 0.2s;
    }
    .theme-btn:hover, .theme-btn:focus-visible { border-color: var(--accent); outline: none; }
    .theme-btn:focus-visible { box-shadow: 0 0 0 3px var(--accent-dim); }
    .timer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(20px, 5vw, 32px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .timer-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, var(--accent-dim) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .timer-card.running::before { opacity: 1; }
    .timer-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 8px; }
    .timer-value {
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      color: var(--accent);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }
    .stats { display: flex; justify-content: center; gap: clamp(16px, 5vw, 32px); margin-top: clamp(16px, 4vh, 24px); padding-top: clamp(16px, 4vh, 24px); border-top: 1px solid var(--border); }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .stat-value { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--fg); }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .main-btn {
      width: 100%;
      padding: clamp(16px, 4vh, 20px);
      font-size: clamp(1.1rem, 3vw, 1.3rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      background: var(--accent);
      color: #0d0d12;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
    }
    .main-btn:active { transform: scale(0.98); }
    .main-btn:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--accent-dim); }
    .main-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .main-btn.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--border); }
    .main-btn.secondary:active { background: var(--border); }
    .btn-row { display: flex; gap: 12px; }
    .btn-row .main-btn { flex: 1; }
    .notes-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(16px, 4vw, 24px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .notes-header { display: flex; justify-content: space-between; align-items: center; }
    .notes-header h2 { font-size: 1rem; font-weight: 600; }
    .notes-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .note-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .note-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); }
    .note-text { font-size: 0.9rem; line-height: 1.5; color: var(--fg); white-space: pre-wrap; word-break: break-word; }
    .note-input-row { display: flex; gap: 8px; }
    .note-input-row textarea {
      flex: 1;
      min-height: 60px;
      max-height: 120px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--fg);
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      transition: border-color 0.2s;
    }
    .note-input-row textarea:focus { outline: none; border-color: var(--accent); }
    .note-input-row .main-btn { width: auto; min-width: 80px; padding: 0 16px; }
    .session-controls { display: flex; gap: 12px; flex-wrap: wrap; }
    .session-controls .main-btn { flex: 1; min-width: 120px; }
    .sound-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .sound-toggle:hover { border-color: var(--accent); }
    .sound-toggle input { accent-color: var(--accent); width: 18px; height: 18px; }
    .sound-toggle span { font-size: 0.9rem; color: var(--fg); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    @media (max-width: 400px) {
      .btn-row { flex-direction: column; }
      .session-controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app" role="main">
    <header>
      <h1>Retake</h1>
      <button class="theme-btn" id="themeBtn" aria-label="Tema değiştir" title="Tema değiştir (T)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span id="themeLabel">Karanlık</span>
      </button>
    </header>

    <div class="timer-card" id="timerCard" aria-live="polite" aria-label="Kronometre">
      <div class="timer-label">Geçen Süre</div>
      <div class="timer-value" id="timerValue" role="timer">00:00.00</div>
      <div class="stats" aria-label="İstatistikler">
        <div class="stat">
          <div class="stat-value" id="retakeCount" aria-label="Tekrar sayısı">0</div>
          <div class="stat-label">Tekrar</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="sessionCount" aria-label="Oturum sayısı">0</div>
          <div class="stat-label">Oturum</div>
        </div>
      </div>
    </div>

    <button class="main-btn" id="retakeBtn" aria-label="Tekrar başlat (Space veya Enter)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M23 4v6a8 8 0 0 1-16 0v-6"/><polyline points="1 4 9 12 1 20"/></svg>
      <span>Tekrar</span>
    </button>

    <div class="btn-row">
      <button class="main-btn secondary" id="resetBtn" aria-label="Sıfırla (R)">Sıfırla</button>
      <button class="main-btn secondary" id="lapBtn" aria-label="Ara süre / Not ekle (N)">Ara Süre</button>
    </div>

    <div class="notes-section" aria-labelledby="notesTitle">
      <div class="notes-header">
        <h2 id="notesTitle">Notlar</h2>
        <span class="sr-only" id="notesCount" aria-live="polite">0 not</span>
      </div>
      <div class="notes-list" id="notesList" role="list"></div>
      <div class="note-input-row">
        <textarea id="noteInput" placeholder="Bu tur için not... (boş bırakılabilir)" aria-label="Not metni"></textarea>
        <button class="main-btn" id="saveNoteBtn" aria-label="Notu kaydet">Kaydet</button>
      </div>
    </div>

    <div class="session-controls" aria-label="Oturum kontrolleri">
      <button class="main-btn secondary" id="saveSessionBtn" aria-label="Oturumu kaydet">Oturumu Kaydet</button>
      <button class="main-btn secondary" id="loadSessionBtn" aria-label="Oturumu yükle">Oturumu Yükle</button>
      <button class="main-btn secondary" id="clearSessionBtn" aria-label="Temizle ve baştan başla">Temizle</button>
    </div>

    <label class="sound-toggle" id="soundToggle" aria-label="Sesli bip aç/kapa">
      <input type="checkbox" id="soundEnabled" aria-hidden="true">
      <span>Sesli bip (her tekrar başında)</span>
    </label>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ========== STATE ==========
    const state = {
      startTime: null,
      elapsed: 0,
      timerId: null,
      running: false,
      retakeCount: 0,
      sessionCount: 0,
      notes: [],
      soundEnabled: true,
      theme: 'dark'
    };

    // ========== DOM ==========
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const timerCard = $('#timerCard');
    const timerValue = $('#timerValue');
    const retakeCountEl = $('#retakeCount');
    const sessionCountEl = $('#sessionCount');
    const retakeBtn = $('#retakeBtn');
    const resetBtn = $('#resetBtn');
    const lapBtn = $('#lapBtn');
    const notesList = $('#notesList');
    const noteInput = $('#noteInput');
    const saveNoteBtn = $('#saveNoteBtn');
    const saveSessionBtn = $('#saveSessionBtn');
    const loadSessionBtn = $('#loadSessionBtn');
    const clearSessionBtn = $('#clearSessionBtn');
    const soundToggle = $('#soundToggle');
    const soundEnabledInput = $('#soundEnabled');
    const themeBtn = $('#themeBtn');
    const themeLabel = $('#themeLabel');
    const toast = $('#toast');
    const notesCountEl = $('#notesCount');

    // ========== UTIL ==========
    function fmtTime(ms) {
      const total = Math.floor(ms);
      const min = Math.floor(total / 60000).toString().padStart(2, '0');
      const sec = Math.floor((total % 60000) / 1000).toString().padStart(2, '0');
      const cs = Math.floor((total % 1000) / 10).toString().padStart(2, '0');
      return `${min}:${sec}.${cs}`;
    }
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
    function saveState() {
      localStorage.setItem('retake-state', JSON.stringify({
        elapsed: state.elapsed,
        retakeCount: state.retakeCount,
        sessionCount: state.sessionCount,
        notes: state.notes,
        soundEnabled: state.soundEnabled,
        theme: state.theme
      }));
    }
    function loadState() {
      try {
        const data = JSON.parse(localStorage.getItem('retake-state') || '{}');
        if (data.elapsed !== undefined) state.elapsed = data.elapsed;
        if (data.retakeCount !== undefined) state.retakeCount = data.retakeCount;
        if (data.sessionCount !== undefined) state.sessionCount = data.sessionCount;
        if (data.notes) state.notes = data.notes;
        if (data.soundEnabled !== undefined) state.soundEnabled = data.soundEnabled;
        if (data.theme) state.theme = data.theme;
      } catch {}
    }
    function playBip() {
      if (!state.soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.stop(ctx.currentTime + 0.15);
      } catch {}
    }
    function renderNotes() {
      notesList.innerHTML = '';
      state.notes.forEach((note, i) => {
        const div = document.createElement('div');
        div.className = 'note-item';
        div.setAttribute('role', 'listitem');
        div.innerHTML = `
          <div class="note-meta">
            <span>#${state.retakeCount - note.retakeIndex + 1} tur</span>
            <span>${new Date(note.time).toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>
          </div>
          <div class="note-text">${note.text || '<em style="color:var(--muted)">(not yok)</em>'}</div>
        `;
        notesList.appendChild(div);
      });
      notesCountEl.textContent = `${state.notes.length} not`;
    }
    function updateUI() {
      timerValue.textContent = fmtTime(state.elapsed);
      retakeCountEl.textContent = state.retakeCount;
      sessionCountEl.textContent = state.sessionCount;
      timerCard.classList.toggle('running', state.running);
      renderNotes();
      soundEnabledInput.checked = state.soundEnabled;
      document.documentElement.setAttribute('data-theme', state.theme);
      themeLabel.textContent = state.theme === 'dark' ? 'Karanlık' : 'Açık';
      saveState();
    }

    // ========== TIMER ==========
    function tick() {
      const now = performance.now();
      state.elapsed = now - state.startTime + state.baseElapsed;
      timerValue.textContent = fmtTime(state.elapsed);
    }
    function startTimer() {
      state.startTime = performance.now();
      state.baseElapsed = state.elapsed;
      state.timerId = setInterval(tick, 16);
      state.running = true;
      updateUI();
    }
    function stopTimer() {
      if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
      state.running = false;
      state.elapsed = performance.now() - state.startTime + state.baseElapsed;
      updateUI();
    }
    function doRetake() {
      if (state.running) {
        stopTimer();
      }
      state.retakeCount++;
      state.elapsed = 0;
      playBip();
      startTimer();
    }
    function doReset() {
      stopTimer();
      state.elapsed = 0;
      state.retakeCount = 0;
      updateUI();
      showToast('Sıfırlandı');
    }
    function doLap() {
      if (!state.running) { showToast('Önce başlatın'); return; }
      const noteText = noteInput.value.trim();
      state.notes.unshift({
        time: Date.now(),
        retakeIndex: state.retakeCount,
        text: noteText
      });
      noteInput.value = '';
      updateUI();
      showToast(noteText ? 'Ara süre + not kaydedildi' : 'Ara süre kaydedildi');
    }

    // ========== SESSION ==========
    function saveSession() {
      const data = {
        elapsed: state.elapsed,
        retakeCount: state.retakeCount,
        sessionCount: state.sessionCount,
        notes: state.notes,
        savedAt: Date.now()
      };
      localStorage.setItem('retake-session', JSON.stringify(data));
      showToast('Oturum kaydedildi');
    }
    function loadSession() {
      try {
        const data = JSON.parse(localStorage.getItem('retake-session') || '{}');
        if (!data.retakeCount && !data.notes?.length) { showToast('Kayıtlı oturum yok'); return; }
        stopTimer();
        state.elapsed = data.elapsed || 0;
        state.retakeCount = data.retakeCount || 0;
        state.sessionCount = data.sessionCount || 0;
        state.notes = data.notes || [];
        state.sessionCount++;
        updateUI();
        showToast('Oturum yüklendi');
      } catch { showToast('Yükleme hatası'); }
    }
    function clearSession() {
      stopTimer();
      state.elapsed = 0;
      state.retakeCount = 0;
      state.sessionCount = 0;
      state.notes = [];
      localStorage.removeItem('retake-session');
      updateUI();
      showToast('Temizlendi');
    }

    // ========== THEME ==========
    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      updateUI();
    }

    // ========== EVENTS ==========
    retakeBtn.addEventListener('click', doRetake);
    resetBtn.addEventListener('click', doReset);
    lapBtn.addEventListener('click', doLap);
    saveNoteBtn.addEventListener('click', () => {
      const text = noteInput.value.trim();
      if (!text) { showToast('Not boş'); return; }
      state.notes.unshift({ time: Date.now(), retakeIndex: state.retakeCount, text });
      noteInput.value = '';
      updateUI();
      showToast('Not kaydedildi');
    });
    saveSessionBtn.addEventListener('click', saveSession);
    loadSessionBtn.addEventListener('click', loadSession);
    clearSessionBtn.addEventListener('click', clearSession);
    soundToggle.addEventListener('click', (e) => {
      if (e.target === soundEnabledInput) return;
      state.soundEnabled = !state.soundEnabled;
      updateUI();
    });
    soundEnabledInput.addEventListener('change', () => {
      state.soundEnabled = soundEnabledInput.checked;
      updateUI();
    });
    themeBtn.addEventListener('click', toggleTheme);

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); doRetake(); }
      else if (e.code === 'KeyR') { doReset(); }
      else if (e.code === 'KeyN') { doLap(); }
      else if (e.code === 'KeyT') { toggleTheme(); }
      else if (e.code === 'KeyS' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveSession(); }
    });

    // Prevent zoom on double tap iOS
    let lastTouch = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouch < 300) e.preventDefault();
      lastTouch = now;
    }, { passive: false });

    // ========== INIT ==========
    loadState();
    updateUI();
    if (state.running) startTimer(); // restore running session (unlikely without startTime)
  </script>
</body>
</html>
